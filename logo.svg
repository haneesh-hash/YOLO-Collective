<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@500;900&amp;display=swap');
    </style>
    <!-- Brand Blue Gradient -->
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" /> <!-- Blue 400 -->
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:1" /> <!-- Blue 600 -->
    </linearGradient>
  </defs>

  <!-- Main Group centered -->
  <g transform="translate(50, 50)">
    
    <!-- MOUNTAINS (Background) -->
    <!-- Stylized geometric mountains in blue -->
    <path d="M250,200 L350,100 L420,180 L460,140 L540,220 L250,220 Z" fill="url(#brandBlue)"  />
    
    <!-- RIVER / SWOOSH (Intertwined with text) -->
    <!-- Creating a flowing shape that looks like the river in the original logo -->
    <path d="M360,220 C360,220 380,300 420,320 C450,335 480,320 480,320 L460,280 C460,280 440,290 420,280 C400,260 400,220 400,220" fill="url(#brandBlue)" />

    <!-- TEXT: YOLO (Custom Geometric Shapes for bold look) -->
    <g transform="translate(0, 100)">
        <!-- Y -->
        <path d="M20,0 L70,0 L110,60 L110,150 L150,150 L150,190 L70,190 L70,150 L70,60 L30,0 Z" fill="black" display="none"/> <!-- Old Y attempt -->
        <!-- Y (Better geometric Match) -->
        <path d="M50,50 L90,120 L90,200 L130,200 L130,120 L170,50 L125,50 L110,80 L95,50 Z" fill="#212121" />

        <!-- O (First) -->
        <circle cx="210" cy="125" r="75" fill="none" stroke="#212121" stroke-width="40" />

        <!-- L -->
        <path d="M300,50 L340,50 L340,160 L400,160 L400,200 L300,200 Z" fill="#212121" />

        <!-- O (Second) -->
        <circle cx="480" cy="125" r="75" fill="none" stroke="#212121" stroke-width="40" />
    </g>

    <!-- HIKER (Silhouette on top of the first O) -->
    <g transform="translate(185, 10)">
        <!-- Abstract Hiker Shape -->
        <!-- Head -->
        <circle cx="25" cy="15" r="10" fill="#212121"/>
        <!-- Body/Pack -->
        <path d="M15,30 L40,25 L50,50 L55,90 L40,115 L25,90 L15,115 L5,90 L10,50 Z" fill="#212121"/>
        <!-- Backpack lump -->
        <path d="M0,35 Q-10,50 5,70 Z" fill="#212121"/>
        <!-- Walking Stick -->
        <path d="M45,40 L60,115" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- SUBTEXT: LIVING (Replacing Backpackers) -->
    <text x="275" y="360" font-family="'Roboto', sans-serif" font-weight="900" font-size="36" fill="#212121" letter-spacing="15" text-anchor="middle">LIVING</text>

  </g>
</svg>

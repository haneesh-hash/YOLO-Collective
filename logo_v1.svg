<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Version 1: Mountain Base L -->
  <rect width="100%" height="100%" fill="white"/>
  <g transform="translate(50, 50)">
    <text x="0" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#212121">YO</text>
    <text x="400" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#212121">O</text>
    
    <!-- Vertical L part -->
    <rect x="290" y="30" width="30" height="120" fill="#212121"/>
    
    <!-- Mountain Shape emerging from L -->
    <path d="M320,150 L420,150 L370,50 Z" fill="#0288D1"/>
    
    <!-- Hiker -->
    <circle cx="360" cy="40" r="6" fill="#212121"/>
    <path d="M355,48 L365,70 L345,70 Z" fill="#212121"/>
    
    <text x="250" y="240" font-family="Arial, sans-serif" font-weight="300" font-size="40" fill="#212121" letter-spacing="12" text-anchor="middle">LIVING</text>
  </g>
</svg>

<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Version 3: Geometric Hiker -->
  <rect width="100%" height="100%" fill="white"/>
  <g transform="translate(50, 50)">
    <text x="0" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#212121">YO</text>
    
    <!-- The L as a solid block -->
    <rect x="300" y="30" width="40" height="120" fill="#212121"/>
    <rect x="300" y="110" width="100" height="40" fill="#212121"/>
    
    <!-- Blue Mountain triangle -->
    <path d="M340,110 L390,40 L440,110 Z" fill="#0277BD"/>
    
    <text x="450" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#212121">O</text>
    
    <!-- Text -->
    <text x="300" y="240" font-family="Arial, sans-serif" font-weight="300" font-size="40" fill="#212121" letter-spacing="12" text-anchor="middle">LIVING</text>
  </g>
</svg>

<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Version 4: River L with Mountain Peaks -->
  <rect width="100%" height="100%" fill="white"/>
  <g transform="translate(50, 50)">
    <text x="0" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#212121">YO</text>
    <text x="380" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#212121">O</text>

    <!-- The flowing L (River) -->
    <path d="M290,30 L330,30 L330,120 Q330,150 360,150 L400,150 L400,180 L360,180 Q300,180 290,120 Z" fill="#039BE5" />
    
    <!-- Mountains rising from the river flow -->
    <!-- Two jagged peaks sitting on the curve -->
    <path d="M330,120 L360,60 L390,120 Z" fill="#546E7A"/>
    <path d="M370,120 L400,80 L430,120 Z" fill="#78909C"/>
    
    <text x="250" y="240" font-family="Arial, sans-serif" font-weight="300" font-size="40" fill="#212121" letter-spacing="12" text-anchor="middle">LIVING</text>
  </g>
</svg>

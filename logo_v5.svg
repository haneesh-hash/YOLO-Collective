<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Version 5: River becomes Mountain -->
  <rect width="100%" height="100%" fill="white"/>
  <g transform="translate(50, 50)">
    <text x="0" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#212121">YO</text>
    <text x="420" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#212121">O</text>

    <!-- The L flows down then spikes up into a mountain -->
    <path d="M290,30 L330,30 L330,120 Q330,150 360,150 L390,50 L420,150 L360,180 Q300,180 290,120 Z" fill="#0277BD" />
    
    <!-- Snow cap on the mountain spike -->
    <path d="M375,100 L390,50 L405,100 Z" fill="white" opacity="0.5"/>

    <text x="250" y="240" font-family="Arial, sans-serif" font-weight="300" font-size="40" fill="#212121" letter-spacing="12" text-anchor="middle">LIVING</text>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Living Logo Variations (Fixed)</title>
    <style>
        /* Import Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;900&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #e0e0e0;
            /* Slightly darker background to make whitespace pop */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .logo-card {
            background: white;
            padding: 30px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        svg {
            border: 1px solid #ddd;
            /* subtle border to debug bounds */
        }
    </style>
</head>

<body>

    <h1>Logo Variations</h1>

    <!-- Version 1: Clean Integration -->
    <div class="logo-card">
        <h2>Version 1: Mountain Base L</h2>
        <svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="blueMountain" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#0288D1;stop-opacity:1" />
                </linearGradient>
            </defs>

            <g transform="translate(50, 50)">
                <!-- Text Group -->
                <text x="0" y="150" font-family="'Roboto', sans-serif" font-weight="900" font-size="140"
                    fill="#212121">YO</text>
                <text x="400" y="150" font-family="'Roboto', sans-serif" font-weight="900" font-size="140"
                    fill="#212121">O</text>

                <!-- The L becomes the mountain -->
                <!-- Vertical L part -->
                <rect x="290" y="30" width="30" height="120" fill="#212121" />

                <!-- Mountain Shape emerging from L -->
                <path d="M320,150 L420,150 L370,50 Z" fill="url(#blueMountain)" />

                <!-- Hiker on the mountain/L -->
                <g transform="translate(355, 40)">
                    <circle cx="5" cy="0" r="6" fill="#212121" />
                    <path d="M0,8 L10,30 L-10,30 Z" fill="#212121" />
                    <line x1="10" y1="15" x2="18" y2="40" stroke="#212121" stroke-width="2" />
                </g>

                <text x="250" y="240" font-family="'Roboto', sans-serif" font-weight="300" font-size="40" fill="#212121"
                    letter-spacing="12" text-anchor="middle">LIVING</text>
            </g>
        </svg>
    </div>

    <!-- Version 2: Flowing River L -->
    <div class="logo-card">
        <h2>Version 2: River L Flow</h2>
        <svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#29B6F6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#01579B;stop-opacity:1" />
                </linearGradient>
            </defs>

            <g transform="translate(50, 50)">
                <text x="0" y="150" font-family="'Roboto', sans-serif" font-weight="900" font-size="140"
                    fill="#212121">YO</text>
                <text x="380" y="150" font-family="'Roboto', sans-serif" font-weight="900" font-size="140"
                    fill="#212121">O</text>

                <!-- L flowing like a river -->
                <path d="M290,30 L330,30 L330,120 Q330,150 360,150 L400,150 L400,180 L360,180 Q300,180 290,120 Z"
                    fill="url(#riverGrad)" />

                <!-- Simple Mountain behind -->
                <path d="M350,120 L400,50 L450,120 Z" fill="#B0BEC5" opacity="0.6" />

                <text x="250" y="240" font-family="'Roboto', sans-serif" font-weight="300" font-size="40" fill="#212121"
                    letter-spacing="12" text-anchor="middle">LIVING</text>
            </g>
        </svg>
    </div>

    <!-- Version 3: Bold Geometric L -->
    <div class="logo-card">
        <h2>Version 3: Geometric Hiker</h2>
        <svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(50, 50)">
                <text x="0" y="150" font-family="'Roboto', sans-serif" font-weight="900" font-size="140"
                    fill="#212121">YO</text>

                <!-- The L as a solid block -->
                <rect x="300" y="30" width="40" height="120" fill="#212121" />
                <rect x="300" y="110" width="100" height="40" fill="#212121" />

                <!-- Blue Mountain triangle sitting on the L arm -->
                <path d="M340,110 L390,40 L440,110 Z" fill="#0277BD" />

                <text x="450" y="150" font-family="'Roboto', sans-serif" font-weight="900" font-size="140"
                    fill="#212121">O</text>

                <!-- Small Hiker vector on top of the L vertical -->
                <circle cx="320" cy="20" r="8" fill="#FFC107" /> <!-- Sun/Head highlight -->

                <text x="300" y="240" font-family="'Roboto', sans-serif" font-weight="300" font-size="40" fill="#212121"
                    letter-spacing="12" text-anchor="middle">LIVING</text>
            </g>
        </svg>
    </div>

</body>

</html>

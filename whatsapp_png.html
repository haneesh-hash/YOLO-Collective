<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YOLO WhatsApp Profile Generator</title>
    <style>
        *, *:focus, *:active { outline: none !important; border: none !important; user-select: none; }
        body { margin: 0; padding: 50px; background: #fff; display: flex; flex-direction: column; align-items: flex-start;}
        
        /* 1080x1080 exact size for crisp PNG exports */
        .whatsapp-crop { 
            width: 1080px; 
            height: 1080px; 
            background: #000000; /* Pure black for maximum contrast with electric blue */
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="whatsapp-crop" id="whatsapp_capture">
        <svg viewBox="0 0 500 500" width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
            <!-- Ensure it fits tightly within the WhatsApp crop circle while staying large and legible -->
            <g transform="translate(18, 140) scale(0.9)">
                <text x="0" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#FFFFFF" letter-spacing="-5">YO</text>
                
                <g transform="translate(-40, 0)"> 
                    <!-- The Electric / Tactical Blue (#039BE5) -->
                    <path d="M260,30 L300,30 L300,120 Q300,150 330,150 L370,150 L370,180 L330,180 Q270,180 260,120 Z" fill="#039BE5" />
                    
                    <path d="M320,150 L370,60 L420,150" fill="#B0BEC5" opacity="0.5"/>
                    <g transform="translate(320, 80) scale(0.9)">
                            <circle cx="5" cy="0" r="6" fill="#FFFFFF"/>
                            <path d="M0,8 L10,30 L-10,30 Z" fill="#FFFFFF"/>
                            <line x1="8" y1="15" x2="20" y2="40" stroke="#FFFFFF" stroke-width="2"/>
                    </g>
                </g>
                
                <text x="340" y="150" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#FFFFFF">O</text>
                <text x="220" y="240" font-family="Arial, sans-serif" font-weight="300" font-size="32" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">COLLECTIVE</text>
            </g>
        </svg>
    </div>
</body>
</html>
